[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recforgetbench"
version = "0.1.0a0"
description = "Modular research infrastructure for recommendation unlearning and user-agent evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RecForgetBench Contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.6,<3",
  "uvicorn>=0.30,<1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", "experiments", ".venv", ".git"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
